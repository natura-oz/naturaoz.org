<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <title>{{ with .Params.override_title }}{{ . }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  {{ block "head" . }}{{ end }}
</head>
<body>
  <header class="navbar">
    <a href="/" class="navbar-brand">
      <img src="{{ "logo-bw.jpg" | relURL }}" alt="Natura o.z." class="navbar-logo">
      <!-- <span>{{ .Site.Title }}</span> -->
    </a>

    <button class="navbar-toggle" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="navbar-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </header>

  <main class="main">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="footer">
    <p>&copy; {{ now.Year }} {{ .Site.Title }}</p>
    <p>Ilkovičova 6, 842 15 Bratislava 4 | <a href="mailto:webmaster@naturaoz.org">webmaster@naturaoz.org</a></p>
  </footer>

  <script>
    document.querySelector('.navbar-toggle').addEventListener('click', function() {
      document.querySelector('.navbar-nav').classList.toggle('active');
    });
  </script>
</body>
</html>
